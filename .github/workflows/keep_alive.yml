name: Keep Streamlit Alive

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Playwright
        run: |
          python3 -m pip install --upgrade pip
          pip3 install playwright
          python3 -m playwright install chromium --with-deps

      - name: Visitar app con navegador real
        run: |
          python3 -c "
          from playwright.sync_api import sync_playwright
          import time

          URL = 'https://indexal.streamlit.app/'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
              )
              page = context.new_page()
              print(f'Conectando a {URL}...')
              try:
                  page.goto(URL, wait_until='domcontentloaded', timeout=45000)
              except Exception as e:
                  print(f'Aviso durante la carga inicial: {e}')

              page.wait_for_timeout(5000)

              wake_btn = page.locator('button:has-text(\"Yes, get this app back up\")')
              if wake_btn.count() > 0:
                  print('App dormida detectada. Haciendo clic para reactivar...')
                  wake_btn.first.click()
                  page.wait_for_timeout(10000)
              else:
                  print('App activa. WebSocket conectado exitosamente.')

              time.sleep(15)
              browser.close()
              print('Completado.')
          "